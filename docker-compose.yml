services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neoclinic-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-8000}
    volumes:
      - ./database.sqlite:/app/database.sqlite

